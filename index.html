<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linux Cheat Sheet - Thực Chiến</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --border-color: #30363d;
            --hover-bg: #161b22;
            --code-bg: #1f242c;
            --code-text: #79c0ff;
            --explain-text: #8b949e;
            --highlight: #d2a8ff; 
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        h1 {
            color: #fff;
            margin-bottom: 10px;
        }

        .search-box {
            width: 100%;
            padding: 12px 20px;
            margin-bottom: 20px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.3);
        }

        /* Cấu trúc Accordion Tầng 1 (Các Phần) */
        details.main-section {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin-bottom: 15px;
            overflow: hidden;
        }

        details.main-section > summary {
            padding: 15px 20px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            background-color: var(--hover-bg);
            color: #fff;
            user-select: none;
            list-style: none;
            position: relative;
        }

        details.main-section > summary::-webkit-details-marker {
            display: none;
        }

        details.main-section > summary::before {
            content: '▶';
            color: var(--accent-color);
            display: inline-block;
            margin-right: 10px;
            transition: transform 0.2s;
        }

        details.main-section[open] > summary::before {
            transform: rotate(90deg);
        }

        .section-content {
            padding: 15px;
        }

        /* Cấu trúc Accordion Tầng 2 (Mục con) */
        details.sub-section {
            border: 1px solid var(--border-color);
            border-radius: 4px;
            margin-bottom: 10px;
            background-color: #010409;
        }

        details.sub-section > summary {
            padding: 10px 15px;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-color);
            user-select: none;
            list-style: none;
            display: flex;
            align-items: center;
        }

        details.sub-section > summary::-webkit-details-marker {
            display: none;
        }

        details.sub-section > summary::before {
            content: '+';
            display: inline-block;
            width: 20px;
            color: var(--accent-color);
            font-size: 18px;
        }
        
        details.sub-section[open] > summary::before {
            content: '−';
        }

        /* Nội dung bên trong mục con */
        .sub-content {
            padding: 10px 15px 15px 35px;
            border-top: 1px solid var(--border-color);
        }

        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        li {
            margin-bottom: 12px;
            border-bottom: 1px dashed #21262d;
            padding-bottom: 8px;
        }

        li:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        code {
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
            background-color: var(--code-bg);
            color: var(--code-text);
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
        }

        .key {
            background-color: #2d333b;
            color: var(--highlight);
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #444c56;
            font-family: monospace;
            font-size: 13px;
            font-weight: bold;
        }

        .desc {
            display: block;
            margin-top: 5px;
            color: var(--explain-text);
            font-size: 14px;
        }

        .only-commands li {
            margin-bottom: 8px;
            border-bottom: none;
            padding-bottom: 0;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            flex-wrap: wrap;
        }

        .only-commands code {
            white-space: nowrap;
        }

        /* Class để ẩn phần tử khi tìm kiếm */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

                { cmd: "yy", desc: "(Trong Vi - chế độ Normal) Copy (Yank) toàn bộ dòng hiện tại." },
                { cmd: "p", desc: "(Trong Vi - chế độ Normal) Dán (Paste) nội dung vừa copy/xóa xuống dưới." },
                { cmd: "/<từ_khóa> -> Enter", desc: "(Trong Vi - chế độ Normal) Tìm kiếm từ khóa. Bấm 'n' để tìm tiếp." }
            ]
        }
    ];

    const container = document.getElementById('cheatsheet-container');
    const searchInput = document.getElementById('searchInput');

    // Hàm tạo HTML cho từng phần
    function renderData() {
        data.forEach((section, index) => {
            const mainDetails = document.createElement('details');
            mainDetails.className = 'main-section';
            
            const mainSummary = document.createElement('summary');
            mainSummary.textContent = section.title;
            mainDetails.appendChild(mainSummary);

            const sectionContent = document.createElement('div');
            sectionContent.className = 'section-content';

            // --- MỤC CON 1: CHỈ HIỆN LỆNH ---
            const subDetailsOnly = document.createElement('details');
            subDetailsOnly.className = 'sub-section';
            subDetailsOnly.innerHTML = `<summary>⚡ Chỉ hiện lệnh (Tra cứu nhanh)</summary>`;
            
            const onlyContent = document.createElement('div');
            onlyContent.className = 'sub-content';
            const ulOnly = document.createElement('ul');
            ulOnly.className = 'only-commands';
            
            section.commands.forEach(item => {
                const li = document.createElement('li');
                let cmdHTML = escapeHTML(item.cmd);
                if (item.cmd.includes('Ctrl') || item.cmd === 'i' || item.cmd === 'Esc' || item.cmd === 'dd' || item.cmd === 'yy' || item.cmd === 'p' || item.cmd.startsWith(':')) {
                    cmdHTML = `<span class="key">${cmdHTML}</span>`;
                } else {
                    cmdHTML = `<code>${cmdHTML}</code>`;
                }
                li.innerHTML = cmdHTML;
                ulOnly.appendChild(li);
            });
            
            onlyContent.appendChild(ulOnly);
            subDetailsOnly.appendChild(onlyContent);
            sectionContent.appendChild(subDetailsOnly);

            // --- MỤC CON 2: HIỆN LỆNH + GIẢI THÍCH ---
            const subDetailsFull = document.createElement('details');
            subDetailsFull.className = 'sub-section';
            subDetailsFull.innerHTML = `<summary>📖 Hiện lệnh + Giải thích (Học tập)</summary>`;
            
            const fullContent = document.createElement('div');
            fullContent.className = 'sub-content';
            const ulFull = document.createElement('ul');
            
            section.commands.forEach(item => {
                const li = document.createElement('li');
                let cmdHTML = escapeHTML(item.cmd);
                if (item.cmd.includes('Ctrl') || item.cmd === 'i' || item.cmd === 'Esc' || item.cmd === 'dd' || item.cmd === 'yy' || item.cmd === 'p' || item.cmd.startsWith(':')) {
                    cmdHTML = `<span class="key">${cmdHTML}</span>`;
                } else {
                    cmdHTML = `<code>${cmdHTML}</code>`;
                }
                li.innerHTML = `
                    ${cmdHTML}
                    <span class="desc">${escapeHTML(item.desc)}</span>
                `;
                ulFull.appendChild(li);
            });
            
            fullContent.appendChild(ulFull);
            subDetailsFull.appendChild(fullContent);
            sectionContent.appendChild(subDetailsFull);

            mainDetails.appendChild(sectionContent);
            container.appendChild(mainDetails);

            // Tính năng: Tự động đóng mục con khi đóng phần
            mainDetails.addEventListener('toggle', function() {
                if (!this.open) {
                    const subSections = this.querySelectorAll('.sub-section');
                    subSections.forEach(sub => sub.removeAttribute('open'));
                }
            });
        });
    }

    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, 
            tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag]));
    }

    // Khởi tạo giao diện
    renderData();

    // --- CHỨC NĂNG TÌM KIẾM (ĐÃ CẬP NHẬT) ---
    searchInput.addEventListener('input', function(e) {
        const searchTerm = e.target.value.toLowerCase().trim();
        const mainSections = document.querySelectorAll('.main-section');

        // NẾU Ô TÌM KIẾM TRỐNG: Reset toàn bộ về trạng thái ban đầu
        if (searchTerm === '') {
            mainSections.forEach(section => {
                section.classList.remove('hidden');
                section.removeAttribute('open'); // Đóng phần chính
                
                const listItems = section.querySelectorAll('li');
                listItems.forEach(li => li.classList.remove('hidden')); // Hiện lại tất cả lệnh
                
                const subs = section.querySelectorAll('.sub-section');
                subs.forEach(sub => sub.removeAttribute('open')); // Đóng các mục con
            });
            return; // Dừng hàm tại đây
        }

        // NẾU CÓ TỪ KHÓA: Thực hiện tìm kiếm như bình thường
        mainSections.forEach(section => {
            let sectionHasMatch = false;
            const listItems = section.querySelectorAll('li');

            listItems.forEach(li => {
                const text = li.textContent.toLowerCase();
                if (text.includes(searchTerm)) {
                    li.classList.remove('hidden');
                    sectionHasMatch = true;
                } else {
                    li.classList.add('hidden');
                }
            });

            // Nếu phần này có kết quả
            if (sectionHasMatch) {
                section.classList.remove('hidden');
                section.setAttribute('open', 'true'); // Mở phần chính để thấy kết quả
                
                // Mở luôn các mục con để thấy rõ
                const subs = section.querySelectorAll('.sub-section');
                subs.forEach(sub => sub.setAttribute('open', 'true'));
            } else {
                section.classList.add('hidden');
                section.removeAttribute('open');
            }
        });
    });
</script>

</body>
</html>
